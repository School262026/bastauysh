.formula span { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.formula i { font-style: normal; color: var(--accent); }

table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function copyButton(text, t) {
  var b = el('button', 'copy', t.copy);
  b.type = 'button';
  b.addEventListener('click', function () {
    var done = function () { b.textContent = t.copied; setTimeout(function () { b.textContent = t.copy; }, 1500); };
    try {
      navigator.clipboard.writeText(text).then(done, function () { selectText(b.previousSibling); });
    } catch (e) { selectText(b.previousSibling); }
  });
  return b;
}

function selectText(node) {
  try { var r = document.createRange(); r.selectNodeContents(node); var s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
}

function render(lang) {
  var t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById('eyebrow').textContent = t.eyebrow;
  document.getElementById('title').textContent = t.title;
  document.getElementById('lead').textContent = t.lead;
  document.getElementById('footer').textContent = t.updated;
  ['kk', 'ru', 'en'].forEach(function (l) { document.getElementById('tab-' + l).setAttribute('aria-selected', String(l === lang)); });

  var bots = document.getElementById('bots');
  bots.textContent = '';
  BOTS.forEach(function (b) {
    var card = el('div', 'bot');
    card.appendChild(el('b', null, b.name));
    var a = el('a', null, b.url.replace('https://', ''));
    a.href = b.url; a.target = '_blank'; a.rel = 'noopener';
    card.appendChild(a);
    bots.appendChild(card);
  });

  var main = document.getElementById('content');
  main.textContent = '';
  var wrap = el('div', 'wrap');
  t.sections.forEach(function (s, i) {
    var sec = el('section');
    var h = el('h2');
    h.appendChild(el('span', 'n', String(i + 1)));
    h.appendChild(document.createTextNode(s.h));
    sec.appendChild(h);
    if (s.formula) {
      var f = el('div', 'formula');
      s.formula.forEach(function (part, j) {
        if (j) f.appendChild(el('i', null, '+'));
        f.appendChild(el('span', null, part));
      });
      sec.appendChild(f);
    }
    if (s.p) sec.appendChild(el('p', null, s.p));
    if (s.list) {
      var ul = el('ul');
      s.list.forEach(function (item) { ul.appendChild(el('li', null, item)); });
      sec.appendChild(ul);
    }
    if (s.examples) {
      var exs = el('div', 'examples');
      s.examples.forEach(function (x) {
        var row = el('div', 'ex');
        row.appendChild(el('div', 'what', x[0]));
        var br = el('div', 'bubble-row');
        br.appendChild(el('div', 'bubble', x[1]));
        br.appendChild(copyButton(x[1], t));
        row.appendChild(br);
        exs.appendChild(row);
      });
      sec.appendChild(exs);
    }
    if (s.sites) {
      var tw = el('div', 'table-wrap');
      var table = el('table');
      var thead = el('tr');
      t.siteHead.forEach(function (c) { thead.appendChild(el('th', null, c)); });
      table.appendChild(thead);
      SITES.forEach(function (site) {
        var tr = el('tr');
        var td = el('td');
        td.appendChild(el('b', null, site[0]));
        td.appendChild(el('br'));
        var a = el('a', null, site[1]);
        a.href = 'https://' + site[1]; a.target = '_blank'; a.rel = 'noopener'; a.style.color = 'var(--mark)';
        td.appendChild(a);
        tr.appendChild(td);
        tr.appendChild(el('td', null, site[2][lang]));
        tr.appendChild(el('td', null, site[3][lang]));
        table.appendChild(tr);
      });
      tw.appendChild(table);
      sec.appendChild(tw);
    }
    wrap.appendChild(sec);
  });
  main.appendChild(wrap);
}

function langFromHash() {
  var h = (location.hash || '').replace('#', '');
  return T[h] ? h : 'kk';
}

document.querySelectorAll('.tabs button').forEach(function (b) {
  b.addEventListener('click', function () { location.hash = b.dataset.lang; });
});
window.addEventListener('hashchange', function () { render(langFromHash()); });
render(langFromHash());
</script>
